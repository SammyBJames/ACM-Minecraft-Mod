name: Feature request
description: Suggest a new block, item, mob, or gameplay change.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please search the
        [existing issues](https://github.com/Scott-Jeppson/ACM-Minecraft-Mod/issues?q=is%3Aissue)
        first to check that it has not already been suggested.
  - type: textarea
    id: summary
    attributes:
      label: What should be added or changed?
      description: Describe the feature from a player's point of view.
      placeholder: Dolphins drop an item that can be used to pay for a beacon effect.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why would this be a good addition?
      description: What problem does it solve, or what does it make more fun?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Vanilla change
        - New block
        - New item
        - New entity
        - Build, tooling, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and acceptance criteria
      description: Optional. Specifics such as recipes, numbers, or a list of what must be true for this to count as done.
    validations:
      required: false
  - type: checkboxes
    id: volunteer
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
          required: false
