name: Bug report
description: Something in the mod is broken or behaves differently than documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search the
        [existing issues](https://github.com/Scott-Jeppson/ACM-Minecraft-Mod/issues?q=is%3Aissue)
        first to check that it has not already been reported.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps someone else can follow to see the bug.
      placeholder: |
        1. Build a five-layer beacon pyramid out of iron blocks
        2. Open the beacon screen
        3. ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version or commit
      description: The `mod_version` from `gradle.properties`, or the commit you built from (`git rev-parse --short HEAD`).
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Development client (gradle runClient)
        - Installed in a Fabric profile (singleplayer)
        - Dedicated server
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: other-mods
    attributes:
      label: Other mods installed
      description: List any mods besides ACM and Fabric API, or write "none".
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Paste the relevant part of `latest.log` or the crash report. It is formatted as code automatically.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, world details, or anything else that helps.
    validations:
      required: false
